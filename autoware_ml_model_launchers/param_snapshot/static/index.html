<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parameter Snapshot Diff</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #1d232f;
        --muted: #657184;
        --line: #d8dde6;
        --accent: #0f766e;
        --changed: #9a3412;
        --added: #047857;
        --removed: #b91c1c;
        --same: #3f4a5c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 14px 18px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      main {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px 18px 24px;
      }

      aside,
      section {
        min-width: 0;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .controls {
        display: grid;
        gap: 14px;
        padding: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      input[type="file"],
      input[type="search"] {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      input[type="search"] {
        padding: 0 10px;
      }

      button {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid #0b5f59;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #eef1f5;
      }

      .segmented button {
        min-height: 32px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--same);
        font-size: 12px;
      }

      .segmented button.active {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 2px rgb(16 24 40 / 0.12);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .stat {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fbfcfd;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 20px;
      }

      .table-wrap {
        overflow: auto;
        max-height: calc(100vh - 184px);
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9fafb;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      code {
        overflow-wrap: anywhere;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      .status {
        width: 86px;
        font-weight: 800;
      }

      .changed {
        color: var(--changed);
      }

      .added {
        color: var(--added);
      }

      .removed {
        color: var(--removed);
      }

      .empty {
        padding: 36px 14px;
        color: var(--muted);
        text-align: center;
      }

      .error {
        display: none;
        border: 1px solid #fecaca;
        border-radius: 6px;
        background: #fff1f2;
        color: #9f1239;
        padding: 10px;
        font-size: 13px;
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }

        .table-wrap {
          max-height: none;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>Parameter Snapshot Diff</h1>
      </div>
    </header>
    <main>
      <aside class="panel controls">
        <label>
          Left snapshot or config
          <input id="leftFile" type="file" accept=".yaml,.yml,text/yaml,text/plain" />
        </label>
        <label>
          Right snapshot or config
          <input id="rightFile" type="file" accept=".yaml,.yml,text/yaml,text/plain" />
        </label>
        <button id="compareButton" type="button">Compare</button>
        <div class="segmented" aria-label="Diff filter">
          <button class="active" type="button" data-filter="all">All</button>
          <button type="button" data-filter="changed">Changed</button>
          <button type="button" data-filter="added">Added</button>
          <button type="button" data-filter="removed">Removed</button>
        </div>
        <label>
          Filter key or value
          <input id="search" type="search" placeholder="camera_mask, use_sim_time, ..." />
        </label>
        <div id="error" class="error"></div>
      </aside>
      <section class="panel">
        <div id="stats" class="stats"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="status">Status</th>
                <th>Parameter</th>
                <th>Left</th>
                <th>Right</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td class="empty" colspan="4">Select two YAML files and compare.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const state = {
        filter: "all",
        rows: [],
        summary: null,
      };

      const leftFile = document.querySelector("#leftFile");
      const rightFile = document.querySelector("#rightFile");
      const compareButton = document.querySelector("#compareButton");
      const search = document.querySelector("#search");
      const rows = document.querySelector("#rows");
      const stats = document.querySelector("#stats");
      const errorBox = document.querySelector("#error");

      function readFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsText(file);
        });
      }

      function valueText(value) {
        if (value === undefined || value === null) return "";
        if (typeof value === "string") return value;
        return JSON.stringify(value);
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = message ? "block" : "none";
      }

      function renderStats(summary) {
        if (!summary) {
          stats.innerHTML = "";
          return;
        }
        const items = [
          ["Left", summary.left_params],
          ["Right", summary.right_params],
          ["Same", summary.same],
          ["Changed", summary.changed],
          ["Added", summary.added],
          ["Removed", summary.removed],
        ];
        stats.innerHTML = items
          .map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`)
          .join("");
      }

      function renderRows() {
        const needle = search.value.trim().toLowerCase();
        const filtered = state.rows.filter((row) => {
          const statusMatch = state.filter === "all" || row.status === state.filter;
          const text = `${row.key} ${valueText(row.left)} ${valueText(row.right)}`.toLowerCase();
          return statusMatch && (!needle || text.includes(needle));
        });

        if (!filtered.length) {
          rows.innerHTML = '<tr><td class="empty" colspan="4">No matching differences.</td></tr>';
          return;
        }

        rows.innerHTML = filtered
          .map(
            (row) => `
              <tr>
                <td class="status ${row.status}">${row.status}</td>
                <td><code>${escapeHtml(row.key)}</code></td>
                <td><code>${escapeHtml(valueText(row.left))}</code></td>
                <td><code>${escapeHtml(valueText(row.right))}</code></td>
              </tr>
            `,
          )
          .join("");
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, (char) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          }[char];
        });
      }

      async function compare() {
        showError("");
        if (!leftFile.files[0] || !rightFile.files[0]) {
          showError("Select both YAML files.");
          return;
        }

        compareButton.disabled = true;
        try {
          const [leftText, rightText] = await Promise.all([
            readFile(leftFile.files[0]),
            readFile(rightFile.files[0]),
          ]);
          const response = await fetch("/api/compare_text", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              left_name: leftFile.files[0].name,
              right_name: rightFile.files[0].name,
              left_text: leftText,
              right_text: rightText,
            }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "Comparison failed.");

          state.summary = payload.summary;
          state.rows = [
            ...payload.changed.map((item) => ({ status: "changed", ...item })),
            ...payload.added.map((item) => ({ status: "added", left: "", ...item })),
            ...payload.removed.map((item) => ({ status: "removed", right: "", ...item })),
          ];
          renderStats(state.summary);
          renderRows();
        } catch (error) {
          showError(error.message);
        } finally {
          compareButton.disabled = false;
        }
      }

      compareButton.addEventListener("click", compare);
      search.addEventListener("input", renderRows);
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-filter]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          state.filter = button.dataset.filter;
          renderRows();
        });
      });
    </script>
  </body>
</html>
